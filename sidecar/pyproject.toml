[project]
name = "pi-desktop-sidecar"
version = "0.2.0"
description = "Pi Desktop sidecar: FTS5 search + analytics"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "pydantic>=2.9"]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.13",
    "httpx>=0.28",
    "pyinstaller>=6.22.2",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"
