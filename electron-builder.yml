appId: dev.pi.desktop
productName: Pi Desktop
directories:
  output: release
files:
  - out/**
  - package.json
# Native modules must live outside the asar archive:
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/better-sqlite3/**
extraResources:
  # Python sidecar binary (built by sidecar/build.sh — see RELEASE.md)
  - from: sidecar/dist/pi-desktop-sidecar
    to: sidecar/pi-desktop-sidecar
  # Menu-bar template images (loaded by createTray at runtime)
  - from: resources/tray
    to: tray
# No auto-update feed yet. This previously pointed at earendil-works/pi-desktop —
# upstream pi's org, not this project's. Re-enable only when (a) this repo has its
# own GitHub remote and (b) builds are signed and notarized (mac.identity is null,
# so electron-updater cannot verify an update's signature). See docs/RELEASE.md.
# publish:
#   provider: github
#   owner: <your-org>
#   repo: <your-repo>
#   releaseType: release
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true # required for notarization (chapter 8)
  darkModeSupport: true
  identity: null # unsigned dev builds; real signing + notarization lands in chapter 8.
                 # NOTE: Developer-ID-signed-but-unnotarized builds were observed being
                 # removed by local security software on the build machine — do not
                 # distribute anything signed but unnotarized.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icon.icns
protocols:
  - name: Pi Desktop OAuth
    schemes:
      - pidesktop
npmRebuild: false
